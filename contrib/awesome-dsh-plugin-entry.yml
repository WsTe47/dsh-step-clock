# 提交到 awesome-dsh-plugin 用（这是要开 PR 的那个文件，不是本仓库的一部分）
#
# 放到目标仓库的这个路径下（文件名必须严格是 <owner>__<repo>.yml）：
#   data/plugins/WsTe47__dsh-step-clock.yml
#
# 目录 <category> 取值必须是下面之一：
#   agi ui usage theme model identity session memory tools wsl browser
#   vision voice docs skill workflow git notify dev security remote market fun
#
# 注意事项（来自 contributing.md）：
#   1. url 必须与仓库地址完全一致。
#   2. 只有 description.en 是必填；zh 可选，缺了维护者会补。
#   3. 描述里若出现「: 」（半角冒号+空格）必须整体加引号，否则 YAML 会解析错。
#   4. PR 只加这一个文件，不要动 README（README 是脚本生成的）。
#   5. 仓库需创建满 1 天，CI 自动检查。
url: https://github.com/WsTe47/dsh-step-clock
name: WsTe47/dsh-step-clock
category: ui
description:
  en: Shows the running agent step above the web composer as a sentence, with its step number, the tools it is running, and how long it has been going; a finished step keeps its duration on screen until the next one starts.
  zh: 在网页版输入框上方用一句话显示当前正在执行的智能体步骤，包括步号、正在执行的工具以及已运行多久；步骤结束后会保留该步用时，直到下一步开始。
